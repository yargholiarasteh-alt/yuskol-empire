
name: Build Yuskol Empire APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev
          pip install --user buildozer cython==0.29.36

      - name: Prepare project
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f
          GAME=$(find . -maxdepth 2 -type f -name '*.py' ! -path './.github/*' | head -n 1)
          if [ -z "$GAME" ]; then
            echo "No Python game file found"
            exit 1
          fi
          cp "$GAME" main.py
          cat > buildozer.spec <<'EOF'
          [app]
          title = Yuskol Empire
          package.name = yuskolempire
          package.domain = org.yuskol
          source.dir = .
          source.include_exts = py,ttf,json,png,jpg,kv
          version = 1.0
          requirements = python3,kivy,arabic-reshaper,python-bidi
          orientation = portrait
          fullscreen = 0
          android.api = 35
          android.minapi = 23
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True
          EOF
          if [ -f Vazirmatn-Regular.ttf ]; then
            echo "Persian font found"
          else
            echo "Warning: Vazirmatn-Regular.ttf not found"
          fi

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuskol-empire-apk
          path: bin/*.apk
